<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" fill="#c8cbce"/>
  
  <!-- Outer Female Silhouette: Hair + Torso (All white solid shape) -->
  <path d="M 100 24 
           C 66 24, 46 44, 46 80 
           C 46 104, 34 124, 32 144 
           C 30 158, 44 158, 54 148 
           C 58 144, 60 138, 62 132
           C 44 152, 38 174, 38 200 
           L 162 200 
           C 162 174, 156 152, 138 132
           C 140 138, 142 144, 146 148
           C 156 158, 170 158, 168 144 
           C 166 124, 154 104, 154 80 
           C 154 44, 134 24, 100 24 Z" fill="#ffffff"/>

  <!-- Face Oval Outline (Grey stroke to define face from hair) -->
  <path d="M 62 82 
           C 60 114, 72 142, 100 142 
           C 128 142, 140 114, 138 82" 
        fill="#ffffff" 
        stroke="#c8cbce" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Forehead Bangs / Hairline Curve (Grey stroke) -->
  <path d="M 58 84 
           C 64 74, 76 74, 90 74 
           C 106 74, 120 58, 138 78" 
        fill="none" 
        stroke="#c8cbce" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Side Hair Separation Lines (Grey stroke) -->
  <path d="M 56 100 C 52 118, 48 132, 44 142" 
        fill="none" 
        stroke="#c8cbce" 
        stroke-width="5" 
        stroke-linecap="round"/>
  <path d="M 144 100 C 148 118, 152 132, 156 142" 
        fill="none" 
        stroke="#c8cbce" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- V-Neck Collar Cutout (Grey stroke) -->
  <path d="M 76 150 L 100 172 L 124 150" 
        fill="none" 
        stroke="#c8cbce" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
