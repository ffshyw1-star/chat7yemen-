<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffa000"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    {/* Crown Base */}
    <path d="M 112 400 L 400 400 L 424 456 C 424 456 384 480 256 480 C 128 480 88 456 88 456 Z" fill="url(#baseGrad)" stroke="#ff8f00" stroke-width="8"/>
    
    {/* Crown Body / Spikes */}
    <path d="M 80 144 L 184 256 L 256 80 L 328 256 L 432 144 L 392 400 L 120 400 Z" fill="url(#goldGrad)" stroke="#ff6f00" stroke-width="8" stroke-linejoin="round"/>
    
    {/* Inner shadow / Highlight */}
    <path d="M 256 110 L 310 240 L 400 165 L 375 380 L 137 380 L 112 165 L 202 240 Z" fill="#ffe57f" opacity="0.6"/>

    {/* Jewels on Crown */}
    <circle cx="184" cy="280" r="18" fill="#d32f2f" stroke="#ffebee" stroke-width="4"/>
    <circle cx="256" cy="240" r="24" fill="#d32f2f" stroke="#ffebee" stroke-width="5"/>
    <circle cx="328" cy="280" r="18" fill="#d32f2f" stroke="#ffebee" stroke-width="4"/>

    {/* Top Pearls */}
    <circle cx="80" cy="144" r="14" fill="#ffffff" stroke="#ffa000" stroke-width="4"/>
    <circle cx="256" cy="80" r="16" fill="#ffffff" stroke="#ffa000" stroke-width="4"/>
    <circle cx="432" cy="144" r="14" fill="#ffffff" stroke="#ffa000" stroke-width="4"/>
  </g>
</svg>
